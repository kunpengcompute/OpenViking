name: UT Job

on:
  workflow_call:
    inputs:
      docker_img:
        required: true
        type: string
      pr_id:
        required: true
        type: string
      target_branch:            # PR 目标分支
        required: true
        type: string

jobs:
  JOB_UT:
    name: UT
    select: selected_by_default
    runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=large ]
    container:
      image: ${{ inputs.docker_img }}
    steps:
      - name: checkout
        identifier: checkout
        uses: checkout
        with:
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
      - name: cache_uv
        uses: cache
        with:
          path: ~/.cache/uv
          key: uv-ut-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-ut-${{ runner.os }}-
      - name: setup_deps   # 复用镜像内预建的 /opt/ov-venv；严格模式：lock 过期则直接失败
        run: |-
          set -euo pipefail
          ln -sfn /opt/ov-venv .venv
          uv sync --frozen --inexact --no-install-project --extra test --extra gemini
      - name: ut   # 开发分支执行源码 UT；master 执行交付检查
        env:
          OV_CI_TARGET_BRANCH: ${{ inputs.branch }}
        run: |-
          if [ "$OV_CI_TARGET_BRANCH" = "master" ]; then
            echo "master 的交付检查由 build_ci.sh 执行，UT 作业返回成功。"
            exit 0
          fi
          export UV_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple
          export UV_DEFAULT_INDEX=https://repo.huaweicloud.com/repository/pypi/simple
          export UV_HTTP_TIMEOUT=600
          export UV_HTTP_RETRIES=5
          export OV_SKIP_UV_SYNC=1   # 依赖与构建后端已由 setup_deps 装好
          if [ -f ut_ci.sh ]; then
            bash ut_ci.sh
          else
            echo "ERROR: ut_ci.sh 在预合入代码和基分支中均不存在"; exit 1
          fi
