name: PR-Pipeline_OpenViking

on: # 自动触发工作流运行的触发条件
  #workflow_dispatch:            # 界面手动运行
  pull_request_target:          # MR 事件触发
    types: ["open", "reopen", "update"]
    branches: [ "*" ]
  pull_request_comment:          # 标准 PR 评论触发事件
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' , 'sca-pr-scan' ]

concurrency: # 并发控制（GitCode 原生语法）
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read
  pr: write
env:
  pr_id: ${{ atomgit.event.pull_request.number }}
  target_branch: ${{ atomgit.event.pull_request.base.ref }}

stages:
  stage0: # 流水线状态管理（非项目逻辑）
    name: 初始化阶段
    select: selected_by_default
    jobs:
      associate_pr_comment:
        name: associate_pr_comment
        runs-on: ["ubuntu-latest", "x64", "slim"]
        steps:
          - name: associate_pr_comment
            uses: associate-pr-comment
      init_pipeline_status: # 打运行中标签
        name: init_pipeline_status
        runs-on: ["ubuntu-latest", "x64", "slim"]
        steps:
          - name: add running label
            uses: openlibing/pr-label-action@v1.0.0
            with:
              add_labels: ci-pipeline-running
              remove_labels: ci-pipeline-passed,ci-pipeline-failed
              token: ${{secrets.PR_LABEL_TOKEN}}
              # fork 未预置 ci-pipeline-running 标签时只告警，不阻断流水线
              fail_on_error: false

  stage1: # 校验阶段
    name: 校验阶段
    select: selected_by_default
    jobs:
      check_skip: # 取 PR 标题判断是否跳过校验（评论事件负载不含 title，回退查 API）
        name: check_skip
        runs-on: ["ubuntu-latest", "x64", "slim"]
        outputs:
          skip: ${{ steps.check.outputs.skip }}
        steps:
          - name: resolve pr title
            id: check
            env:
              PR_TITLE: ${{ atomgit.event.pull_request.title }}
              PR_ID: ${{ env.pr_id }}
              REPO: ${{ atomgit.repository }}
            run: |
              set -u
              title="$PR_TITLE"
              if [ -z "$title" ]; then
                title=$(curl -sS --max-time 30 "https://api.gitcode.com/api/v5/repos/${REPO}/pulls/${PR_ID}" | grep -o '"title":"[^"]*"' | head -n 1 | cut -d'"' -f4)
              fi
              echo "pr title: $title"
              case "$title" in
                *ci-pipeline-skip*) echo "skip=true" >> "$ATOMGIT_OUTPUT" ;;
                *) echo "skip=false" >> "$ATOMGIT_OUTPUT" ;;
              esac

      Detect_file_changes: # 纯文档 PR 跳过 build/ut（必备作业）
        name: Detect_file_changes
        needs: [ check_skip ]
        # 标题含 ci-pipeline-skip 时跳过所有校验，post 阶段直接打 ci-pipeline-passed
        if: ${{ jobs.check_skip.outputs.skip != 'true' }}
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          repository: read
          pr: read
        outputs:
          need_build: ${{ steps.set-skip.outputs.need_build }}
        steps:
          - name: checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ env.target_branch }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                doc-only:
                  - 'docs/**'
                  - '**/*.md'
                  - '**/*.rst'
                  - '**/*.log'
                  - '**/*.png'
                  - '**/*.jpg'
                  - '**/*.doc'
                  - '**/*.eddx'
                  - '**/*.svg'
          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "doc-only: ${{ steps.filter.outputs.doc-only }}"
              if [ "${{ steps.filter.outputs.doc-only }}" = "true" ]; then
                echo "need_build=no" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build=yes" >> "$ATOMGIT_OUTPUT"
              fi

      sca-pr: # SCA 扫描（project-name 取上游组织名 boostkit）
        name: sca-pr
        needs: [ check_skip ]
        if: ${{ jobs.check_skip.outputs.skip != 'true' }}
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          id-token: write
        steps:
          - name: sca pr scan
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: "boostkit"

      AntiPoison-scan: # 恶意代码扫描
        name: AntiPoison-scan
        needs: [ check_skip ]
        if: ${{ jobs.check_skip.outputs.skip != 'true' }}
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          id-token: write
        steps:
          - name: malicious code scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              project-name: "boostkit"

      pre-commit: # 代码风格检查（仓库 .pre-commit-config.yaml 仅 ruff hook）
        name: pre-commit
        needs: [ check_skip ]
        if: ${{ jobs.check_skip.outputs.skip != 'true' }}
        runs-on: ["ubuntu-latest", "x64", "slim"]
        permissions:
          repository: read
          pr: read
        steps:
          - name: Checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: Setup Python
            uses: setup-python
            with:
              python-version: "3.14"
          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.0

      build:
        name: build
        if: ${{ jobs.check_skip.outputs.skip != 'true' && jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        needs: [ check_skip, Detect_file_changes ]      # 门控 outputs 引用必须保留（附录二第10条）
        uses: .gitcode/workflows/build_job.yml
        with:
          docker_img: "swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/openeuler24.03_lts_sp3:OpenViking_26.3.0.04"
          pr_id: "${{ env.pr_id }}"
          target_branch: "${{ env.target_branch }}"

      ut:
        name: ut
        if: ${{ jobs.check_skip.outputs.skip != 'true' && jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        needs: [ check_skip, Detect_file_changes ]      # 门控 outputs 引用必须保留（附录二第10条）
        uses: .gitcode/workflows/ut_job.yml
        with:
          docker_img: "swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/openeuler24.03_lts_sp3:OpenViking_26.3.0.04"
          pr_id: "${{ env.pr_id }}"
          target_branch: "${{ env.target_branch }}"

post:
  jobs:
    update_pipeline_status:
      name: update_pipeline_status
      runs-on: ["ubuntu-latest", "x64", "slim"]
      steps:
        # 标题含 ci-pipeline-skip 时校验作业全部被跳过，upstream_status 仍为 COMPLETED，直接落 passed
        - name: Set result label
          uses: openlibing/pr-label-action@v1.0.0
          with:
            add_labels: ${{ pipeline.upstream_status == 'COMPLETED' && 'ci-pipeline-passed' || 'ci-pipeline-failed' }}
            remove_labels: ci-pipeline-running,${{ pipeline.upstream_status == 'COMPLETED' && 'ci-pipeline-failed' || 'ci-pipeline-passed' }}
            token: ${{secrets.PR_LABEL_TOKEN}}
