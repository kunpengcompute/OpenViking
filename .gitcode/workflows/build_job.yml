name: Build Job

on:
  workflow_call:
    inputs:
      docker_img:
        required: true
        type: string
      pr_id:
        required: true
        type: string
      target_branch:            # PR 目标分支
        required: true
        type: string

jobs:
  JOB_Compile:
    name: Compile
    select: selected_by_default
    runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=large ]
    container:
      image: ${{ inputs.docker_img }}
    steps:
      - name: checkout
        identifier: checkout
        uses: checkout
        with:
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
      - name: setup_deps   # 复用镜像内预建的 /opt/ov-venv；严格模式：lock 过期则直接失败
        run: |-
          set -euo pipefail
          ln -sfn /opt/ov-venv .venv
          uv sync --frozen --inexact --no-install-project
      - name: build
        run: |-
          export UV_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple
          export UV_DEFAULT_INDEX=https://repo.huaweicloud.com/repository/pypi/simple
          export UV_HTTP_TIMEOUT=600
          export UV_HTTP_RETRIES=5
          export OV_SKIP_UV_SYNC=1   # 依赖与构建后端已由 setup_deps 装好
          if [ -f build_ci.sh ]; then
            bash build_ci.sh
          else
            echo "ERROR: build_ci.sh 在预合入代码和基分支中均不存在"; exit 1
          fi
