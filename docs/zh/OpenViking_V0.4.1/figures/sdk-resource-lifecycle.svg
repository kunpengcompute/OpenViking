<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1130" viewBox="0 0 1240 1130" role="img" aria-labelledby="title desc">
  <title id="title">SDK 资源生命周期：应用连接池与 Run 执行对象</title>
  <desc id="desc">应用持有共享 HTTP 连接池。图示为每 Run 创建 SDK 的接入形式：应用先初始化 SDK，再注入 Middleware；Handle 校验就绪状态，Run 结束后应用关闭本轮 SDK，进程退出时关闭连接池。</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#416c9b"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#458671"/></marker>
  </defs>
  <style>
    text {font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#20364b}
    .title {font-size:28px;font-weight:650}
    .name {font-size:22px;font-weight:650}
    .body {font-size:18px;fill:#435a6c}
    .small {font-size:17px;fill:#607689}
    .flow {fill:none;stroke:#416c9b;stroke-width:2;marker-end:url(#blue)}
    .borrow {fill:none;stroke:#458671;stroke-width:2;marker-end:url(#green)}
    .life {stroke:#9bb6d5;stroke-width:2;stroke-dasharray:6 5}
  </style>
  <rect width="1240" height="1130" fill="white"/>
  <text x="40" y="52" class="title">SDK 资源生命周期</text>
  <text x="40" y="84" class="small">时间从上向下推进。应用持有连接池，每 Run 创建执行对象；以下展示应用注入 SDK 的接入方式。</text>

  <rect x="40" y="116" width="340" height="880" rx="14" fill="#f3f9f6" stroke="#9fcdbf"/>
  <text x="64" y="154" class="name">应用进程 · 共享连接池</text>
  <rect x="64" y="180" width="292" height="92" rx="10" fill="white" stroke="#9fcdbf"/>
  <text x="84" y="215" class="name">应用启动时创建</text>
  <text x="84" y="248" class="body">httpx.AsyncClient</text>
  <rect x="256" y="272" width="8" height="724" rx="4" fill="#9fcdbf"/>
  <text x="64" y="536" class="small">在各 Run 之间持续存活</text>
  <text x="64" y="566" class="small">由应用统一管理关闭</text>

  <rect x="420" y="190" width="780" height="610" rx="14" fill="#f8fafc" stroke="#bac8d5"/>
  <text x="444" y="228" class="name">Run A：创建 → 首次使用 → 请求 → 结束</text>
  <rect x="450" y="270" width="320" height="102" rx="10" fill="#edf4ff" stroke="#9bb6d5"/>
  <text x="470" y="306" class="name">AsyncHTTPClient</text>
  <text x="470" y="340" class="body">应用为本 Run 创建 SDK</text>
  <rect x="850" y="270" width="320" height="102" rx="10" fill="#edf4ff" stroke="#9bb6d5"/>
  <text x="870" y="306" class="name">Middleware / Handle</text>
  <text x="870" y="340" class="body">引用本 Run 的 SDK</text>
  <path d="M770 320 H850" class="flow"/>
  <text x="787" y="300" class="small">注入</text>
  <path d="M610 372 V698" class="life"/>
  <path d="M1010 372 V698" class="life"/>

  <text x="682" y="577" class="body">Handle.get() 校验 SDK 就绪</text>
  <path d="M1010 596 H610" class="flow"/>
  <text x="292" y="485" class="small">应用预先调用 SDK.initialize() 绑定连接池</text>
  <path d="M610 504 H264" class="borrow"/>

  <text x="682" y="627" class="body">Writer / Reader 等请求复用 SDK</text>
  <text x="292" y="675" class="small">各次 HTTP 请求复用连接资源</text>
  <path d="M610 688 H264" class="borrow"/>

  <rect x="450" y="698" width="320" height="80" rx="10" fill="white" stroke="#9bb6d5"/>
  <text x="470" y="730" class="body">应用调用 SDK.close()</text>
  <text x="470" y="760" class="small">解除本 Run 的连接池借用</text>
  <rect x="850" y="698" width="320" height="80" rx="10" fill="white" stroke="#9bb6d5"/>
  <text x="870" y="730" class="body">Middleware.aclose()</text>
  <text x="870" y="760" class="small">结束 AsyncClientHandle 使用</text>

  <rect x="450" y="856" width="720" height="100" rx="12" fill="#edf4ff" stroke="#9bb6d5"/>
  <text x="474" y="892" class="name">Run B：创建新的 SDK、Middleware 与 Handle</text>
  <text x="474" y="926" class="body">按同样的创建、初始化和关闭规则执行</text>
  <path d="M450 914 H264" class="borrow"/>
  <text x="288" y="897" class="small">继续借用</text>

  <rect x="40" y="1022" width="1160" height="78" rx="12" fill="#edf7f4" stroke="#9fcdbf"/>
  <text x="64" y="1056" class="name">应用退出</text>
  <text x="250" y="1056" class="body">等待在途 Run 执行及收尾结束，再调用共享连接池的 aclose()。</text>
  <path d="M260 996 V1020" class="borrow"/>
</svg>
