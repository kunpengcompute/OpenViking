<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1410" viewBox="0 0 1240 1410" role="img" aria-labelledby="title desc">
  <title id="title">消息写入算法：增量、预校验、批量写入与缓存更新</title>
  <desc id="desc">按 write_index 选取原始图消息增量，无增量时返回。发送首批前完成全部消息转换和 JSON 预校验，随后分批调用 batch_add_messages，校验写入结果并按请求位置及 tool_id 匹配短视图。全部批次成功后，Writer 返回原生增量和新游标，SessionEngine 更新缓存及游标，Hook 返回更新状态。校验、写入失败或结果不确定时抛出异常并保留原游标，记录已确认批次进度。后续 Run 按 checkpoint 已保存的游标继续写入，接受远端已落盘消息被再次写入。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#416c9b"/></marker>
    <marker id="error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a97738"/></marker>
  </defs>
  <style>
    text {font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#20364b}
    .title {font-size:28px;font-weight:650}
    .name {font-size:22px;font-weight:650}
    .body {font-size:19px;fill:#435a6c}
    .small {font-size:17px;fill:#607689}
    .flow {fill:none;stroke:#416c9b;stroke-width:2;marker-end:url(#arrow)}
    .error {fill:none;stroke:#a97738;stroke-width:2;marker-end:url(#error)}
    .center {text-anchor:middle}
  </style>
  <rect width="1240" height="1410" fill="white"/>
  <text x="40" y="52" class="title">消息写入算法流程</text>
  <text x="40" y="85" class="small">增量按原始图消息游标选取；全部批次成功后统一更新 OVContext。</text>

  <rect x="330" y="120" width="620" height="76" rx="12" fill="#edf4ff" stroke="#9bb6d5"/>
  <text x="640" y="165" class="name center">按 write_index 选取原始图消息增量</text>
  <path d="M640 196 V231" class="flow"/>
  <path d="M640 232 L760 292 L640 352 L520 292 Z" fill="#f6f9fd" stroke="#9bb6d5"/>
  <text x="640" y="299" class="body center">存在待写消息？</text>
  <path d="M520 292 H236" class="flow"/>
  <text x="368" y="274" class="small">否</text>
  <rect x="40" y="254" width="196" height="76" rx="12" fill="#f4f7fb" stroke="#bac8d5"/>
  <text x="138" y="300" class="name center">直接返回</text>
  <path d="M640 352 V402" class="flow"/>
  <text x="661" y="385" class="small">是</text>

  <rect x="330" y="402" width="620" height="100" rx="12" fill="#edf4ff" stroke="#9bb6d5"/>
  <text x="640" y="442" class="name center">转换为 OV 消息</text>
  <text x="640" y="477" class="body center">首批发送前完成全部格式与 JSON 预校验</text>
  <path d="M640 502 V552" class="flow"/>
  <rect x="330" y="552" width="620" height="100" rx="12" fill="#edf4ff" stroke="#9bb6d5"/>
  <text x="640" y="592" class="name center">分批调用 batch_add_messages</text>
  <text x="640" y="627" class="body center">校验本批写入结果</text>
  <path d="M640 652 V702" class="flow"/>
  <rect x="330" y="702" width="620" height="100" rx="12" fill="#edf4ff" stroke="#9bb6d5"/>
  <text x="640" y="742" class="name center">按请求位置及 tool_id 匹配短视图</text>
  <text x="640" y="777" class="body center">更新对应 ToolMessage 副本的正文</text>
  <path d="M640 802 V842" class="flow"/>
  <path d="M640 843 L760 903 L640 963 L520 903 Z" fill="#f6f9fd" stroke="#9bb6d5"/>
  <text x="640" y="910" class="body center">还有下一批？</text>
  <path d="M520 903 H276 V602 H330" class="flow"/>
  <text x="293" y="883" class="small">是：处理下一批</text>
  <path d="M640 963 V1010" class="flow"/>
  <text x="661" y="992" class="small">否</text>

  <path d="M950 452 H994" class="error"/>
  <text x="982" y="409" class="small">预校验失败</text>
  <path d="M950 602 H1101 V552" class="error"/>
  <text x="978" y="642" class="small">写入失败 / 结果不确定</text>
  <rect x="994" y="424" width="214" height="128" rx="12" fill="#fff8ed" stroke="#d7b781"/>
  <text x="1101" y="459" class="body center">抛出异常</text>
  <text x="1101" y="492" class="small center">保留原 OVContext 游标</text>
  <text x="1101" y="524" class="small center">记录已确认批次进度</text>

  <rect x="330" y="1010" width="620" height="78" rx="12" fill="#edf7f4" stroke="#9fcdbf"/>
  <text x="640" y="1058" class="name center">Writer 返回原生消息增量与新游标</text>
  <path d="M640 1088 V1130" class="flow"/>
  <rect x="330" y="1130" width="620" height="90" rx="12" fill="#edf7f4" stroke="#9fcdbf"/>
  <text x="640" y="1166" class="name center">SessionEngine 校验返回结果</text>
  <text x="640" y="1199" class="body center">追加或更新缓存，推进 write_index</text>
  <path d="M640 1220 V1261" class="flow"/>
  <rect x="330" y="1261" width="620" height="72" rx="12" fill="#edf7f4" stroke="#9fcdbf"/>
  <text x="640" y="1305" class="name center">Hook 返回更新后的 OVContext 状态</text>
  <text x="40" y="1383" class="small">异常后续写：从 checkpoint 已保存的 write_index 继续，允许再次写入远端已落盘的消息。</text>
</svg>
