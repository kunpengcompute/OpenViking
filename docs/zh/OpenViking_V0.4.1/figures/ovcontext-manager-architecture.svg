<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1200" viewBox="0 0 1240 1200" role="img" aria-labelledby="title desc">
<title id="title">OVContext 状态管理器架构与组件协作</title>
<desc id="desc">OpenVikingContextMiddleware 从图状态恢复 OVContext，校验身份标识，更新本轮状态与召回注入，并向框架返回更新后的 OVContext 状态。SessionEngine 将 Writer、Reader 和 Commit 的操作结果应用到 OVContext 的消息缓存、归档边界及操作进度。ContextAssembler 读取缓存、确定 refresh 保留范围并构造候选副本，经预算校验后由 SessionEngine 应用。make_session_tools 读取会话绑定，OVContextState 经图状态和 BaseCheckpointSaver 保存恢复。</desc>
<defs>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#416c9b"/></marker>
  <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#778899"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#458671"/></marker>
</defs>
<style>
  text {font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#20364b}
  .name {font-size:23px;font-weight:650}
  .body {font-size:18px;fill:#435a6c}
  .small {font-size:16px;fill:#607689}
  .section {font-size:18px;font-weight:650;fill:#315873}
  .field {font-size:17px;fill:#263f51}
  .key {font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-weight:600;fill:#1e536b}
  .call {fill:none;stroke:#416c9b;stroke-width:2;marker-end:url(#blue)}
  .bus {fill:none;stroke:#416c9b;stroke-width:2}
  .read {fill:none;stroke:#778899;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#gray)}
  .persist {fill:none;stroke:#458671;stroke-width:2;marker-start:url(#green);marker-end:url(#green)}
</style>
<rect width="1240" height="1200" fill="white"/>

<rect x="28" y="28" width="1152" height="132" rx="12" fill="#edf4ff" stroke="#9bb6d5" stroke-width="1.5"/>
<text x="52" y="65" class="name">OpenVikingContextMiddleware</text>
<text x="52" y="99" class="body">从 state["ov_context"] 恢复 OVContext，校验 owner，调用其方法更新本轮状态与召回注入。</text>
<text x="52" y="130" class="body">将 OVContext 传给 SessionEngine 与组装器；返回更新后的 OVContext 状态，由框架写回图状态。</text>
<path d="M280 160 V220" class="call"/>
<path d="M892 160 V220" class="call"/>
<rect x="60" y="220" width="440" height="112" rx="12" fill="#edf4ff" stroke="#9bb6d5" stroke-width="1.5"/>
<text x="80" y="258" class="name">SessionEngine</text>
<text x="80" y="290" class="body">将组件返回结果应用到 OVContext。</text>
<text x="80" y="317" class="small">更新 messages、归档边界及写入与提交进度。</text>
<path d="M500 276 H600" class="call"/>
<text x="515" y="262" class="small">更新状态</text>
<path d="M60 276 H28 V765" class="bus"/>
<rect x="60" y="370" width="440" height="120" rx="12" fill="#f8fafc" stroke="#bac8d5" stroke-width="1.5"/>
<text x="80" y="405" class="name">OVMessageWriter</text>
<text x="80" y="432" class="small">接口：MessageWriterBase</text>
<text x="80" y="457" class="body">write() → WriteResult</text>
<text x="80" y="480" class="small">返回原生增量消息与新写入游标。</text>
<path d="M28 430 H60" class="call"/>
<rect x="60" y="530" width="440" height="142" rx="12" fill="#f8fafc" stroke="#bac8d5" stroke-width="1.5"/>
<text x="80" y="565" class="name">OVContextReader</text>
<text x="80" y="592" class="small">接口：ContextReaderBase</text>
<text x="80" y="618" class="body">exchange_context() → ContextSnapshot</text>
<text x="80" y="645" class="small">快照经组装与预算校验后替换缓存。</text>
<text x="80" y="665" class="small">recall() 由 Middleware 调用并应用结果。</text>
<path d="M28 601 H60" class="call"/>
<rect x="60" y="712" width="440" height="118" rx="12" fill="#f8fafc" stroke="#bac8d5" stroke-width="1.5"/>
<text x="80" y="747" class="name">OpenVikingCommitPolicy</text>
<text x="80" y="774" class="small">接口：OVCommitPolicy</text>
<text x="80" y="800" class="body">commit() → CommitResult</text>
<text x="80" y="821" class="small">回执由 SessionEngine 记录为提交进度。</text>
<path d="M28 765 H60" class="call"/>
<rect x="600" y="220" width="580" height="700" rx="12" fill="#fff" stroke="#70a899" stroke-width="1.5"/>
<text x="624" y="255" class="name">OVContext</text>
<text x="810" y="255" class="body">Session 级上下文状态管理器</text>
<path d="M600 274 H1180" stroke="#c4dcd3" stroke-width="1"/>
<text x="624" y="302" class="section">会话绑定与准备状态</text>
<text x="624" y="330" class="field"><tspan class="key">session_id</tspan><tspan>：标识当前状态所属的 OV Session。</tspan></text>
<text x="624" y="356" class="field"><tspan class="key">owner</tspan><tspan>：绑定 account、user、actor peer 与 Session。</tspan></text>
<text x="624" y="382" class="field"><tspan class="key">context_status</tspan><tspan>：记录待初始化、已就绪或待补读状态。</tspan></text>
<text x="624" y="408" class="small">uninitialized / ready / reload_required</text>
<path d="M620 424 H1160" stroke="#e0e9e5" stroke-width="1"/>
<text x="624" y="451" class="section">模型消息缓存</text>
<text x="624" y="479" class="field"><tspan class="key">messages</tspan><tspan>：保存模型历史组装使用的原生消息。</tspan></text>
<text x="624" y="505" class="field"><tspan class="key">archive_id</tspan><tspan>：标识缓存已应用的归档边界与版本。</tspan></text>
<path d="M620 521 H1160" stroke="#e0e9e5" stroke-width="1"/>
<text x="624" y="548" class="section">写入与提交进度</text>
<text x="624" y="576" class="field"><tspan class="key">write_index</tspan><tspan>：记录原始图消息的下一待写位置。</tspan></text>
<text x="624" y="602" class="field"><tspan class="key">completed_runs</tspan><tspan>：记录当前提交周期的已完成 Run 数。</tspan></text>
<text x="624" y="628" class="field"><tspan class="key">commit_count</tspan><tspan>：记录已观察到的远端提交次数。</tspan></text>
<text x="624" y="654" class="field"><tspan class="key">pending_commit</tspan><tspan>：保存待核对的提交任务与归档边界。</tspan></text>
<text x="624" y="680" class="field"><tspan class="key">last_completed_run</tspan><tspan>：标识最近已计数的 Run。</tspan></text>
<text x="624" y="706" class="field"><tspan class="key">last_activity</tspan><tspan>：记录最近一次成功消息同步的时间。</tspan></text>
<path d="M620 722 H1160" stroke="#e0e9e5" stroke-width="1"/>
<text x="624" y="749" class="section">本轮临时状态</text>
<text x="624" y="777" class="field"><tspan class="key">run_id</tspan><tspan>：标识当前活跃的 Run。</tspan></text>
<text x="624" y="803" class="field"><tspan class="key">original_user</tspan><tspan>：保存本轮召回注入前的用户原文。</tspan></text>
<text x="624" y="829" class="field"><tspan class="key">recall_done</tspan><tspan>：记录本轮是否已尝试召回。</tspan></text>
<text x="624" y="855" class="field"><tspan class="key">recall_status</tspan><tspan>：记录成功、空、超时或错误的召回结果。</tspan></text>
<text x="624" y="897" class="small">会话状态跨请求延续；本轮临时状态在结束时清理。</text>
<rect x="60" y="905" width="440" height="125" rx="12" fill="#fafbfd" stroke="#bac8d5" stroke-width="1.5"/>
<text x="80" y="942" class="name">ContextAssembler</text>
<text x="80" y="973" class="body">refresh() 构造候选，prepare() 校验请求。</text>
<text x="80" y="1001" class="small">确定近期保留范围，校验完整模型输入预算。</text>
<path d="M600 871 H548 V967 H500" class="read"/>
<text x="510" y="957" class="small">只读</text>
<rect x="600" y="970" width="580" height="100" rx="12" fill="#edf8f2" stroke="#8cb9a5" stroke-width="1.5"/>
<text x="624" y="1005" class="name">OVContextState / OVPluginState</text>
<text x="624" y="1033" class="body">to_state() / from_state()：状态映射与对象转换。</text>
<text x="624" y="1057" class="small">DeepAgents 经 BaseCheckpointSaver 保存、恢复图状态。</text>
<path d="M892 920 V970" class="persist"/>
<text x="910" y="950" class="small">保存 / 重建</text>
<rect x="60" y="1060" width="440" height="88" rx="12" fill="#fafbfd" stroke="#bac8d5" stroke-width="1.5"/>
<text x="80" y="1096" class="name">make_session_tools()</text>
<text x="80" y="1127" class="small">校验 owner / session_id / run_id 后回读工具原文。</text>
<path d="M600 897 H572 V1104 H500" class="read"/>
<path d="M40 1180 H78" class="call"/>
<text x="90" y="1186" class="small">组件调用 / 状态更新</text>
<path d="M334 1180 H372" class="read"/>
<text x="384" y="1186" class="small">只读状态</text>
<path d="M570 1180 H608" class="persist"/>
<text x="620" y="1186" class="small">状态保存与恢复</text>
</svg>
